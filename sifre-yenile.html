<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Şifre yenile · Duvarda Sor</title><style>body{margin:0;background:#f5f2fa;color:#241734;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{box-sizing:border-box;width:min(440px,92vw);padding:32px;background:white;border-radius:24px}h1{font-size:26px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d4ccdf;border-radius:10px;font:inherit}button{margin-top:24px;background:#7438ba;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#7438ba}</style></head><body><main><strong>Duvarda Sor</strong><h1>Yeni şifreni belirle</h1><p id="status" role="status" aria-live="polite">Yenileme bağlantısı kontrol ediliyor…</p><form id="form" hidden><label for="password">Yeni şifre</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Yeni şifre tekrar</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save" type="submit">Şifreyi kaydet</button></form><p><a href="./index.html">Ana sayfa</a></p></main><script>
'use strict';
const base='https://qnzsniwhankrvicknoqp.supabase.co/auth/v1';
const key='sb_publishable_OTRRDF5iY40Y3rnhpwBqHg_1JVy7A9K';
const params=new URLSearchParams(location.hash.slice(1));
let token=params.get('access_token');
const recovery=params.get('type')==='recovery';
history.replaceState(null,'',location.pathname);
const statusEl=document.getElementById('status'),form=document.getElementById('form'),save=document.getElementById('save');
const headers=()=>({'apikey':key,'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function init(){
 if(!token||!recovery){token=null;statusEl.textContent='Geçerli bir şifre yenileme bağlantısı bulunamadı. E-postandaki en son yenileme bağlantısını aç veya yeni bağlantı iste.';return;}
 try{const r=await fetch(base+'/user',{headers:headers(),cache:'no-store'});if(!r.ok)throw new Error();statusEl.textContent='En az 12 karakterden oluşan, başka bir hesapta kullanmadığın güçlü bir şifre belirle.';form.hidden=false;}
 catch{token=null;statusEl.textContent='Bağlantı doğrulanamadı veya süresi doldu. Lütfen yeni bir şifre yenileme e-postası iste.';}
}
form.addEventListener('submit',async e=>{
 e.preventDefault();const p=document.getElementById('password'),c=document.getElementById('confirm');
 if(p.value!==c.value){statusEl.textContent='Şifreler eşleşmiyor.';return;}
 save.disabled=true;statusEl.textContent='Şifre kaydediliyor…';
 try{
 const r=await fetch(base+'/user',{method:'PUT',headers:headers(),body:JSON.stringify({password:p.value})});
 if(!r.ok){const d=await r.json().catch(()=>({}));statusEl.textContent=d.error_code==='same_password'?'Öncekinden farklı bir şifre seç.':'Şifre değiştirilemedi. Güçlü bir şifre kullan veya yeni yenileme bağlantısı iste.';save.disabled=false;return;}
 p.value='';c.value='';form.hidden=true;statusEl.textContent='Şifren güncellendi. Duvarda Sor uygulamasına dönerek yeni şifrenle giriş yapabilirsin.';
 await fetch(base+'/logout?scope=local',{method:'POST',headers:headers()}).catch(()=>{});token=null;
 }catch{statusEl.textContent='Bağlantı hatası oluştu. İnternetini kontrol edip tekrar dene.';save.disabled=false;}
});
init();
</script></body></html>
